openapi: 3.0.3
info:
  title: PGVPT - MS Événements API
  version: 3.0.0
  description: Propriétaire des événements culturels/touristiques et de leurs sessions, capacités, tarifs et disponibilités.
    ms-reservation orchestre la réservation sans posséder la capacité.
servers:
- url: http://localhost:3005/api/v1
  description: Environnement local
- url: https://api.pgvpt.sn/evenement/api/v1
  description: Environnement de production
security:
- bearerAuth: []
tags:
- name: Evenements
- name: Sessions
paths:
  /evenements:
    get:
      tags:
      - Evenements
      operationId: searchEvenements
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: zoneTouristiqueId
        in: query
        schema:
          type: string
          format: uuid
      - name: type
        in: query
        schema:
          $ref: '#/components/schemas/TypeEvenement'
      - name: statut
        in: query
        schema:
          $ref: '#/components/schemas/StatutEvenement'
      - name: dateDebut
        in: query
        schema:
          type: string
          format: date-time
      - name: dateFin
        in: query
        schema:
          type: string
          format: date-time
      - name: search
        in: query
        schema:
          type: string
          maxLength: 250
      responses:
        '200':
          description: Événements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvenementPage'
    post:
      tags:
      - Evenements
      operationId: createEvenement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvenementCreate'
      responses:
        '201':
          description: Événement créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evenement'
        '409':
          $ref: '#/components/responses/Conflict'
  /evenements/{id}:
    get:
      tags:
      - Evenements
      operationId: getEvenement
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Événement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evenement'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Evenements
      operationId: updateEvenement
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvenementUpdate'
      responses:
        '200':
          description: Événement modifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evenement'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags:
      - Evenements
      operationId: deleteEvenement
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Événement supprimé
        '409':
          $ref: '#/components/responses/Conflict'
  /evenements/{id}/programmer:
    patch:
      tags:
      - Evenements
      operationId: programmerEvenement
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Événement programmé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evenement'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /evenements/{id}/ouvrir:
    patch:
      tags:
      - Evenements
      operationId: ouvrirEvenement
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Événement ouvert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evenement'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /evenements/{id}/annuler:
    patch:
      tags:
      - Evenements
      operationId: annulerEvenement
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Événement annulé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evenement'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /evenements/{id}/terminer:
    patch:
      tags:
      - Evenements
      operationId: terminerEvenement
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Événement terminé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evenement'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /evenements/{id}/sessions:
    get:
      tags:
      - Sessions
      operationId: listSessions
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionEvenement'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Sessions
      operationId: createSession
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionEvenementCreate'
      responses:
        '201':
          description: Session créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionEvenement'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /sessions/{id}:
    get:
      tags:
      - Sessions
      operationId: getSession
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionEvenement'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Sessions
      operationId: updateSession
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionEvenementUpdate'
      responses:
        '200':
          description: Session modifiée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionEvenement'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags:
      - Sessions
      operationId: deleteSession
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Session supprimée
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /evenements/{id}/disponibilite:
    get:
      tags:
      - Evenements
      operationId: getEvenementDisponibilite
      summary: Vérifier la disponibilité d'un événement
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: date
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: nombrePersonnes
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Disponibilité
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisponibiliteEvenement'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Conflit métier
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    BadRequest:
      description: Requête invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Authentification requise
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Accès interdit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UnprocessableEntity:
      description: Données métier invalides
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InternalServerError:
      description: Erreur interne
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    BaseEntity:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    EvenementCreate:
      type: object
      required:
      - titre
      - type
      - zoneTouristiqueId
      - organisateurActeurId
      properties:
        titre:
          type: string
          minLength: 2
          maxLength: 250
        description:
          type: string
          maxLength: 5000
        type:
          $ref: '#/components/schemas/TypeEvenement'
        zoneTouristiqueId:
          type: string
          format: uuid
        patrimoineId:
          type: string
          format: uuid
          nullable: true
        organisateurActeurId:
          type: string
          format: uuid
        statut:
          $ref: '#/components/schemas/StatutEvenement'
        capaciteMax:
          type: integer
          minimum: 1
        tarif:
          type: number
          format: double
          minimum: 0
        devise:
          type: string
          minLength: 3
          maxLength: 3
          default: XOF
        reservationRequise:
          type: boolean
          default: false
        langues:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 2
            maxLength: 10
    EvenementUpdate:
      allOf:
      - $ref: '#/components/schemas/EvenementCreate'
    Evenement:
      allOf:
      - $ref: '#/components/schemas/BaseEntity'
      - $ref: '#/components/schemas/EvenementCreate'
    SessionEvenementCreate:
      type: object
      required:
      - dateDebut
      - dateFin
      properties:
        dateDebut:
          type: string
          format: date-time
        dateFin:
          type: string
          format: date-time
        capacite:
          type: integer
          minimum: 1
        lieu:
          type: string
          maxLength: 500
        patrimoineId:
          type: string
          format: uuid
          nullable: true
    SessionEvenementUpdate:
      allOf:
      - $ref: '#/components/schemas/SessionEvenementCreate'
    SessionEvenement:
      allOf:
      - $ref: '#/components/schemas/BaseEntity'
      - $ref: '#/components/schemas/SessionEvenementCreate'
    TypeEvenement:
      type: string
      enum:
      - FESTIVAL
      - CONCERT
      - EXPOSITION
      - CONFERENCE
      - CEREMONIE
      - FETE_CULTURELLE
      - ARTISANAT
      - SPORT
      - VISITE_GUIDEE
      - AUTRE
    StatutEvenement:
      type: string
      enum:
      - BROUILLON
      - PROGRAMME
      - OUVERT
      - COMPLET
      - TERMINE
      - ANNULE
    EvenementPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Evenement'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    ApiError:
      type: object
      required:
      - timestamp
      - status
      - code
      - message
      - path
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        code:
          type: string
        message:
          type: string
        path:
          type: string
        details:
          type: object
          additionalProperties: true
    DisponibiliteEvenement:
      type: object
      required:
      - disponible
      - capaciteMax
      - placesRestantes
      properties:
        disponible:
          type: boolean
        capaciteMax:
          type: integer
          minimum: 0
        placesRestantes:
          type: integer
          minimum: 0
        sessionId:
          type: string
          format: uuid
          nullable: true
        motif:
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
