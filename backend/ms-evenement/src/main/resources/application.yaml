server:
  port: 3005
  servlet:
    context-path: /api/v1

spring:
  application:
    name: ms-evenement
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false

  # --- Désactiver Spring Cloud Config et Eureka pour le dev local ---
  config:
    import: "optional:configserver:"
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
    discovery:
      enabled: false

  # --- Base de données PostgreSQL ---
  datasource:
    url: jdbc:postgresql://localhost:5432/evenement_db
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: "Thies@#1521"

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# --- Eureka désactivé ---
eureka:
  client:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: '*'
