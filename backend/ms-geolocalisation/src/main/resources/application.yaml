server:
  port: 3002
  servlet:
    context-path: /api/v1

spring:
  application:
    name: ms-geolocalisation

  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:9999}"

  jackson:
    default-property-inclusion: non_null

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:geo_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
