openapi: 3.0.3
info:
  title: PGVPT - MS Identité API
  version: 2.0.0
  description: Propriétaire des comptes utilisateurs, authentification, profils et rôles. Les autres microservices ne conservent
    que des UUID d'utilisateurs/acteurs.
servers:
- url: /api/v1
tags:
- name: Authentification
- name: Utilisateurs
- name: Profils
- name: Administration
paths:
  /auth/register:
    post:
      tags:
      - Authentification
      operationId: register
      summary: Créer un compte utilisateur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Compte créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/login:
    post:
      tags:
      - Authentification
      operationId: login
      summary: Authentifier un utilisateur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentification réussie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          description: Compte verrouillé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurResponse'
  /auth/refresh:
    post:
      tags:
      - Authentification
      operationId: refreshToken
      summary: Renouveler le token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token renouvelé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags:
      - Authentification
      operationId: logout
      summary: Déconnecter la session courante
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Déconnexion effectuée
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me:
    get:
      tags:
      - Profils
      operationId: getCurrentUser
      summary: Obtenir l'utilisateur authentifié
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Utilisateur courant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Utilisateur'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags:
      - Profils
      operationId: updateCurrentUser
      summary: Mettre à jour le profil courant
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilUpdateRequest'
      responses:
        '200':
          description: Profil mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Utilisateur'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users:
    get:
      tags:
      - Utilisateurs
      operationId: searchUsers
      summary: Rechercher les utilisateurs
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - name: search
        in: query
        schema:
          type: string
      - name: role
        in: query
        schema:
          $ref: '#/components/schemas/Role'
      - name: statut
        in: query
        schema:
          $ref: '#/components/schemas/StatutUtilisateur'
      - name: actif
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: Page d'utilisateurs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UtilisateurPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Administration
      operationId: createUser
      summary: Créer un utilisateur par administration
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UtilisateurCreateRequest'
      responses:
        '201':
          description: Utilisateur créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Utilisateur'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /users/{id}:
    parameters:
    - $ref: '#/components/parameters/UserId'
    get:
      tags:
      - Utilisateurs
      operationId: getUser
      summary: Obtenir un utilisateur
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Utilisateur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Utilisateur'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Administration
      operationId: updateUser
      summary: Modifier un utilisateur
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UtilisateurUpdateRequest'
      responses:
        '200':
          description: Utilisateur mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Utilisateur'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags:
      - Administration
      operationId: deleteUser
      summary: Supprimer un utilisateur
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Utilisateur supprimé
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /users/{id}/activer:
    patch:
      tags:
      - Administration
      operationId: activateUser
      summary: Activer un compte
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Compte activé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Utilisateur'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /users/{id}/desactiver:
    patch:
      tags:
      - Administration
      operationId: deactivateUser
      summary: Désactiver un compte
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Compte désactivé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Utilisateur'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /users/{id}/roles:
    put:
      tags:
      - Administration
      operationId: updateUserRoles
      summary: Remplacer les rôles d'un utilisateur
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolesUpdateRequest'
      responses:
        '200':
          description: Rôles mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Utilisateur'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Requête invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Authentification requise
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Accès interdit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Conflit métier
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UnprocessableEntity:
      description: Données métier invalides
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InternalServerError:
      description: Erreur interne
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    BaseEntity:
      type: object
      required:
      - id
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    Utilisateur:
      allOf:
      - $ref: '#/components/schemas/BaseEntity'
      - type: object
        required:
        - email
        - nom
        - prenom
        - roles
        - statut
        - actif
        properties:
          email:
            type: string
            format: email
            maxLength: 255
          nom:
            type: string
            minLength: 1
            maxLength: 100
          prenom:
            type: string
            minLength: 1
            maxLength: 100
          telephone:
            type: string
            maxLength: 30
          roles:
            type: array
            uniqueItems: true
            items:
              $ref: '#/components/schemas/Role'
          statut:
            $ref: '#/components/schemas/StatutUtilisateur'
          actif:
            type: boolean
          emailVerifie:
            type: boolean
          telephoneVerifie:
            type: boolean
          dernierAcces:
            type: string
            format: date-time
            readOnly: true
    RegisterRequest:
      type: object
      required:
      - email
      - motDePasse
      - nom
      - prenom
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        motDePasse:
          type: string
          format: password
          minLength: 8
          maxLength: 100
          writeOnly: true
        nom:
          type: string
          minLength: 1
          maxLength: 100
        prenom:
          type: string
          minLength: 1
          maxLength: 100
        telephone:
          type: string
          maxLength: 30
    LoginRequest:
      type: object
      required:
      - email
      - motDePasse
      properties:
        email:
          type: string
          format: email
        motDePasse:
          type: string
          format: password
          writeOnly: true
    RefreshTokenRequest:
      type: object
      required:
      - refreshToken
      properties:
        refreshToken:
          type: string
          writeOnly: true
    AuthResponse:
      type: object
      required:
      - accessToken
      - tokenType
      - expiresIn
      - utilisateur
      properties:
        accessToken:
          type: string
          readOnly: true
        refreshToken:
          type: string
          readOnly: true
        tokenType:
          type: string
          default: Bearer
          readOnly: true
        expiresIn:
          type: integer
          format: int64
          readOnly: true
        utilisateur:
          $ref: '#/components/schemas/Utilisateur'
    ProfilUpdateRequest:
      type: object
      properties:
        nom:
          type: string
          maxLength: 100
        prenom:
          type: string
          maxLength: 100
        telephone:
          type: string
          maxLength: 30
    UtilisateurCreateRequest:
      type: object
      required:
      - email
      - nom
      - prenom
      - roles
      properties:
        email:
          type: string
          format: email
        nom:
          type: string
          maxLength: 100
        prenom:
          type: string
          maxLength: 100
        telephone:
          type: string
          maxLength: 30
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Role'
        motDePasse:
          type: string
          format: password
          minLength: 8
          maxLength: 100
          writeOnly: true
    UtilisateurUpdateRequest:
      type: object
      properties:
        nom:
          type: string
          maxLength: 100
        prenom:
          type: string
          maxLength: 100
        telephone:
          type: string
          maxLength: 30
        email:
          type: string
          format: email
    RolesUpdateRequest:
      type: object
      required:
      - roles
      properties:
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Role'
    Role:
      type: string
      enum:
      - ADMIN
      - GESTIONNAIRE
      - GESTIONNAIRE_PATRIMOINE
      - GESTIONNAIRE_TOURISME
      - GESTIONNAIRE_EVENEMENT
      - GESTIONNAIRE_RESERVATION
      - TOURISTE
      - PARTENAIRE
    StatutUtilisateur:
      type: string
      enum:
      - EN_ATTENTE
      - ACTIF
      - SUSPENDU
      - DESACTIVE
      - VERROUILLE
    UtilisateurPage:
      type: object
      required:
      - content
      - page
      - size
      - totalElements
      - totalPages
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Utilisateur'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          minimum: 0
    ErreurResponse:
      type: object
      required:
      - status
      - code
      - message
      properties:
        status:
          type: integer
        code:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        path:
          type: string
        details:
          type: object
          additionalProperties: true
    ApiError:
      type: object
      required:
      - timestamp
      - status
      - code
      - message
      - path
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        code:
          type: string
        message:
          type: string
        path:
          type: string
        details:
          type: object
          additionalProperties: true
security:
- bearerAuth: []
