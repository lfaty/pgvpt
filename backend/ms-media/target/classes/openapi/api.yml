openapi: 3.0.3
info:
  title: PGVPT - MS Media API
  version: 2.0.0
  description: Propriétaire des métadonnées des photos, vidéos, audios, documents, panoramas 360, modèles 3D, cartes et archives
    numérisées du patrimoine.
servers:
- url: http://localhost:3006/api/v1
  description: Local
security:
- bearerAuth: []
tags:
- name: Médias
paths:
  /medias:
    get:
      tags:
      - Médias
      operationId: listMedias
      parameters:
      - name: patrimoineId
        in: query
        schema:
          type: string
          format: uuid
      - name: type
        in: query
        schema:
          $ref: '#/components/schemas/TypeMedia'
      responses:
        '200':
          description: Médias
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Media'
    post:
      tags:
      - Médias
      operationId: createMedia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaCreate'
      responses:
        '201':
          description: Média enregistré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
  /medias/{id}:
    get:
      tags:
      - Médias
      operationId: getMedia
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Média
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
    delete:
      tags:
      - Médias
      operationId: deleteMedia
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Supprimé
    put:
      tags:
      - Médias
      operationId: updateMedia
      summary: Mettre à jour les métadonnées d'un média
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaCreate'
      responses:
        '200':
          description: Média mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    BaseEntity:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    TypeMedia:
      type: string
      enum:
      - PHOTO
      - VIDEO
      - AUDIO
      - DOCUMENT
      - PANORAMA_360
      - MODELE_3D
      - CARTE
      - ARCHIVE_NUMERISEE
    MediaCreate:
      type: object
      required:
      - patrimoineId
      - type
      - nom
      - url
      properties:
        patrimoineId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/TypeMedia'
        nom:
          type: string
        description:
          type: string
        url:
          type: string
          format: uri
        mimeType:
          type: string
        tailleOctets:
          type: integer
          format: int64
          minimum: 0
        langue:
          type: string
        auteur:
          type: string
        droitsUtilisation:
          type: string
        credit:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        statut:
          type: string
          enum:
          - BROUILLON
          - VALIDE
          - PUBLIE
          - ARCHIVE
          default: BROUILLON
        checksumSha256:
          type: string
          pattern: ^[A-Fa-f0-9]{64}$
    Media:
      allOf:
      - $ref: '#/components/schemas/BaseEntity'
      - $ref: '#/components/schemas/MediaCreate'
    ApiError:
      type: object
      required:
      - timestamp
      - status
      - code
      - message
      - path
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        code:
          type: string
        message:
          type: string
        path:
          type: string
        details:
          type: object
          additionalProperties: true
  responses:
    BadRequest:
      description: Requête invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Authentification requise
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Accès interdit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Conflit métier
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UnprocessableEntity:
      description: Données métier invalides
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InternalServerError:
      description: Erreur interne
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
