openapi: 3.0.3
info:
  title: PGVPT - MS Contenu API
  version: 2.0.0
  description: Propriétaire des contenus historiques, culturels, touristiques et multilingues associés aux patrimoines. patrimoineId
    et mediaIds sont des UUID; les fichiers sont gérés par ms-media.
servers:
- url: http://localhost:3004/api/v1
  description: Local
security:
- bearerAuth: []
tags:
- name: Contenus
- name: Traductions
paths:
  /contenus:
    get:
      tags:
      - Contenus
      operationId: listContenus
      parameters:
      - name: patrimoineId
        in: query
        schema:
          type: string
          format: uuid
      - name: langue
        in: query
        schema:
          type: string
      - name: statut
        in: query
        schema:
          $ref: '#/components/schemas/StatutContenu'
      responses:
        '200':
          description: Contenus
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Contenu'
    post:
      tags:
      - Contenus
      operationId: createContenu
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContenuCreate'
      responses:
        '201':
          description: Créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contenu'
  /contenus/{id}:
    get:
      tags:
      - Contenus
      operationId: getContenu
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Contenu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contenu'
    put:
      tags:
      - Contenus
      operationId: updateContenu
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContenuUpdate'
      responses:
        '200':
          description: Mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contenu'
    delete:
      tags:
      - Contenus
      operationId: deleteContenu
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Supprimé
  /contenus/{id}/valider:
    patch:
      tags:
      - Contenus
      operationId: validerContenu
      summary: Valider un contenu
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Valider un contenu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contenu'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /contenus/{id}/publier:
    patch:
      tags:
      - Contenus
      operationId: publierContenu
      summary: Publier un contenu
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Publier un contenu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contenu'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /contenus/{id}/archiver:
    patch:
      tags:
      - Contenus
      operationId: archiverContenu
      summary: Archiver un contenu
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Archiver un contenu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contenu'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    BaseEntity:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    StatutContenu:
      type: string
      enum:
      - BROUILLON
      - EN_REVISION
      - VALIDE
      - PUBLIE
      - ARCHIVE
    TypeContenu:
      type: string
      enum:
      - ARTICLE
      - DESCRIPTION
      - HISTORIQUE
      - RECIT
      - TEMOIGNAGE
      - GUIDE_VISITE
      - ACTUALITE
    ContenuCreate:
      type: object
      required:
      - patrimoineId
      - type
      - langue
      - titre
      - corps
      properties:
        patrimoineId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/TypeContenu'
        langue:
          type: string
          minLength: 2
        titre:
          type: string
        resume:
          type: string
        corps:
          type: string
        auteurActeurId:
          type: string
          format: uuid
        motsCles:
          type: array
          items:
            type: string
        mediaIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
          description: UUID des médias gérés par ms-media.
    ContenuUpdate:
      allOf:
      - $ref: '#/components/schemas/ContenuCreate'
    Contenu:
      allOf:
      - $ref: '#/components/schemas/BaseEntity'
      - $ref: '#/components/schemas/ContenuCreate'
      - type: object
        properties:
          statut:
            $ref: '#/components/schemas/StatutContenu'
          datePublication:
            type: string
            format: date-time
    ApiError:
      type: object
      required:
      - timestamp
      - status
      - code
      - message
      - path
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        code:
          type: string
        message:
          type: string
        path:
          type: string
        details:
          type: object
          additionalProperties: true
  responses:
    BadRequest:
      description: Requête invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Authentification requise
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Accès interdit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Conflit métier
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UnprocessableEntity:
      description: Données métier invalides
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InternalServerError:
      description: Erreur interne
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
