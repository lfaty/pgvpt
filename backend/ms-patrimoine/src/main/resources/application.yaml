server:
  port: 3001
  servlet:
    context-path: /api/v1

spring:
  application:
    name: ms-patrimoine

  # --- Désactiver Spring Cloud Config et Eureka pour le dev local ---
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false

  # --- Base de données H2 en mémoire (pour le premier test) ---
  datasource:
    url: jdbc:h2:mem:patrimoine_db
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# --- Eureka désactivé ---
eureka:
  client:
    enabled: false
