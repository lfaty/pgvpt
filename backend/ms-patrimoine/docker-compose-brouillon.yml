version: '3.8'

services:
  db:
    image: postgres:16
    container_name: ms-patrimoine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: patrimoine_db
    ports:
      - "5433:5432"
  app:
    image: ms-patrimoine:latest
    container_name: patrimoine-app
    restart: on-failure
    depends_on:
      - db
    ports:
      - "3001:3001"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/patrimoine_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=admin
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update

