server:
  port: 9999

spring:
  application:
    name: pgvpt-config

  cloud:
    config:
      server:
        git:
          uri: https://github.com/lfaty/pgvpt-config-repo.git
          default-label: main
          clone-on-start: true
          force-pull: true
          basedir: /tmp/pgvpt-config-repo

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.cloud.config: INFO