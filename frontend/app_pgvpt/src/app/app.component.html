<div class="flex flex-col min-h-screen bg-transparent text-gray-900">
  <router-outlet></router-outlet>
  <app-toast-container></app-toast-container>

  <!-- Indicateur global rotatif pour toute requête de création / POST -->
  <div *ngIf="loadingService.isPosting()"
       class="fixed bottom-6 right-6 z-[99999] bg-gray-900/95 text-white backdrop-blur-md px-4 py-3 rounded-2xl shadow-2xl flex items-center gap-3 border border-gray-700/80 animate-fade-in pointer-events-none select-none">
    <div class="relative w-5 h-5 flex items-center justify-center">
      <div class="w-5 h-5 border-2 border-emerald-400/30 border-t-emerald-400 rounded-full animate-spin"></div>
    </div>
    <div class="flex flex-col">
      <span class="text-xs font-bold text-gray-100">Traitement en cours</span>
      <span class="text-[10px] text-gray-400 font-medium">Enregistrement des données sur le serveur...</span>
    </div>
  </div>
</div>
