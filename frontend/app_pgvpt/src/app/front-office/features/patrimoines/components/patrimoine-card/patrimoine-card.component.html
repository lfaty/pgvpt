<div class="card" [routerLink]="['/patrimoines', patrimoine.id]">
  
  <!-- Image Container -->
  <div class="card-image">
    <img #img [src]="patrimoine.imageUrl || 'assets/images/activite_saloum.jpg'" 
         (error)="img.src='assets/images/activite_saloum.jpg'"
         [alt]="patrimoine.nom" class="card-img">
    
    <!-- Gradient overlay -->
    <div class="card-image-overlay"></div>

    <!-- Category Badge -->
    <div class="badge-top-left">
      <span class="category-badge"
            [class.badge-historique]="patrimoine.type === 'MONUMENT'"
            [class.badge-naturel]="patrimoine.type === 'SITE_NATUREL'"
            [class.badge-culturel]="patrimoine.type === 'MUSEE'">
        <i class="fa-solid"
           [class.fa-mountain-sun]="patrimoine.type === 'SITE_NATUREL'"
           [class.fa-monument]="patrimoine.type === 'MONUMENT'"
           [class.fa-building-columns]="patrimoine.type === 'MUSEE'"
           style="font-size:0.55rem;"></i>
        {{ formatCategorie(patrimoine.categorie) }}
      </span>
    </div>
    
    <!-- Rating Badge -->
    <div *ngIf="patrimoine.note" class="badge-top-right">
      <div class="rating-badge">
        <i class="fa-solid fa-star star-icon"></i>
        <span class="rating-text">{{ patrimoine.note }}</span>
      </div>
    </div>

    <!-- Bottom gradient info -->
    <div class="card-image-info">
      <div class="card-location-overlay">
        <i class="fa-solid fa-location-dot"></i>
        <span>{{ patrimoine.region || 'Sénégal' }}{{ patrimoine.departement ? ' · ' + patrimoine.departement : '' }}</span>
      </div>
    </div>
  </div>

  <!-- Content -->
  <div class="card-body">

    <!-- Title & Description -->
    <h3 class="card-title">{{ patrimoine.nom }}</h3>
    <p class="card-description">{{ patrimoine.descriptionCourte || patrimoine.description }}</p>

    <!-- Action -->
    <div class="card-footer">
      <span class="card-link-text">Découvrir</span>
      <div class="card-link-arrow">
        <i class="fa-solid fa-arrow-right"></i>
      </div>
    </div>
    
  </div>
</div>
