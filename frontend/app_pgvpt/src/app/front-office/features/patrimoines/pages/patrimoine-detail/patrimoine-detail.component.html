<!-- Loading State -->
<div *ngIf="loading" class="td-loading">
  <div class="td-loader">
    <div class="td-loader-ring"></div>
    <p class="mt-6 text-sm font-semibold text-gray-500 tracking-wide">Chargement du patrimoine…</p>
  </div>
</div>

<!-- Main Content -->
<div *ngIf="!loading && patrimoine" class="td-page">

  <!-- HERO IMMERSIF -->
  <app-entete-patrimoine
    [patrimoine]="patrimoine"
    [geolocalisation]="geolocalisation"
    [mainImage]="mainImage"
    [mediaCount]="galerieMedias.length"
    (navigate)="scrollToSection($event)">
  </app-entete-patrimoine>

  <!-- NAVIGATION STICKY -->
  <app-onglets-navigation
    [activeSection]="activeSection"
    [scrollProgress]="scrollProgress"
    [hasRecits]="contenus && contenus.length > 0"
    [hasConservation]="!!patrimoine.conservation"
    [hasGalerie]="galerieMedias.length > 0"
    [titre]="patrimoine.nom"
    (sectionChange)="scrollToSection($event)">
  </app-onglets-navigation>

  <!-- CONTENU PRINCIPAL + SIDEBAR -->
  <div class="td-body">
    <div class="mx-auto max-w-[1200px] px-6 py-12 md:py-16">
      <div class="flex flex-col lg:flex-row gap-10">

        <!-- Colonne principale (2/3) -->
        <div class="lg:w-2/3 min-w-0">

          <!-- Section 1 : Aperçu -->
          <app-apercu-patrimoine
            [patrimoine]="patrimoine"
            [geolocalisation]="geolocalisation"
            [mainImage]="mainImage">
          </app-apercu-patrimoine>

          <!-- Section 2 : Histoire & Caractéristiques -->
          <app-caracteristiques-patrimoine
            [patrimoine]="patrimoine"
            [geolocalisation]="geolocalisation"
            [mainImage]="mainImage">
          </app-caracteristiques-patrimoine>

          <!-- Section 3 : Récits & Guides éditoriaux -->
          <app-recits-patrimoine
            *ngIf="contenus && contenus.length > 0"
            [patrimoine]="patrimoine"
            [contenus]="contenus"
            [filteredContenus]="filteredContenus"
            [uniqueContenuTypes]="uniqueContenuTypes"
            [selectedContenuType]="selectedContenuType"
            [contenuSearchQuery]="contenuSearchQuery"
            [allMedias]="allMedias"
            [medias]="medias"
            [mainImage]="mainImage"
            (contenuTypeChange)="setContenuTypeFilter($event)"
            (searchQueryChange)="contenuSearchQuery = $event; applyContenuFilters()"
            (selectContenu)="openContenuReader($event)">
          </app-recits-patrimoine>
        </div>

        <!-- Sidebar « Préparer votre visite » (1/3, sticky) -->
        <aside class="lg:w-1/3 shrink-0">
          <div class="lg:sticky lg:top-[80px]">
            <app-planifier-visite
              [patrimoine]="patrimoine"
              [geolocalisation]="geolocalisation"
              (navigate)="scrollToSection($event)">
            </app-planifier-visite>
          </div>
        </aside>
      </div>
    </div>
  </div>

  <!-- Section 4 : Galerie multimédia (pleine largeur) -->
  <app-galerie-medias
    [patrimoine]="patrimoine"
    [galerieMedias]="galerieMedias"
    [mediaTabs]="mediaTabs"
    [activeMediaFilter]="activeMediaFilter"
    [mediaSearchQuery]="mediaSearchQuery"
    [mediaSortOrder]="mediaSortOrder"
    [filteredPhotos]="filteredPhotos"
    [filteredVideos]="filteredVideos"
    [filteredAudios]="filteredAudios"
    [filteredDocuments]="filteredDocuments"
    [filteredImmersions]="filteredImmersions"
    (filterChange)="setMediaFilter($event)"
    (searchChange)="mediaSearchQuery = $event; applyMediaFilters()"
    (sortChange)="mediaSortOrder = $event; applyMediaFilters()">
  </app-galerie-medias>

  <!-- Section 5 : Conservation -->
  <app-etat-conservation
    *ngIf="patrimoine.conservation"
    [patrimoine]="patrimoine"
    [expandedThreatIndex]="expandedThreatIndex"
    (toggleThreat)="toggleThreat($event)">
  </app-etat-conservation>

  <!-- Section 6 : Accès & Carte -->
  <app-carte-localisation
    [mapUrl]="mapUrl"
    [geolocalisation]="geolocalisation">
  </app-carte-localisation>

  <!-- Section 7 : Patrimoines similaires -->
  <app-patrimoines-similaires
    [similaires]="similaires">
  </app-patrimoines-similaires>

  <!-- Modales -->
  <app-visionneuse-plein-ecran
    [isOpen]="lightboxOpen"
    [medias]="currentLightboxMedias"
    [currentIndex]="currentLightboxIndex"
    (close)="closeLightbox()"
    (next)="nextLightboxMedia($event)"
    (prev)="prevLightboxMedia($event)">
  </app-visionneuse-plein-ecran>

  <app-modale-lecture-recit
    [isOpen]="readingModalOpen"
    [contenu]="selectedContenuForReading"
    (close)="closeContenuReader()">
  </app-modale-lecture-recit>
</div>
