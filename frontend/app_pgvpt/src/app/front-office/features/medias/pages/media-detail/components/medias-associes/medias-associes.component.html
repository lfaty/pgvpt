<div *ngIf="relatedMedias && relatedMedias.length > 0" class="bg-white rounded-3xl p-6 sm:p-7 border border-gray-100 shadow-sm mt-8">
  <div class="flex items-center justify-between mb-5">
    <div>
      <span class="text-[11px] font-bold uppercase tracking-wider text-[#D16933] block">Collection associée</span>
      <h4 class="font-serif text-lg font-bold text-gray-900">Autres médias du site historique</h4>
    </div>
    <span class="text-xs text-gray-400 font-medium">{{ relatedMedias.length }} autre{{ relatedMedias.length > 1 ? 's' : '' }}</span>
  </div>

  <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
    <a *ngFor="let rm of relatedMedias"
       [routerLink]="['/patrimoines', patrimoineId, 'medias', rm.id]"
       class="rounded-2xl overflow-hidden border border-gray-100 group hover:border-[#0b5d5e]/30 shadow-2xs hover:shadow-md transition-all flex flex-col no-underline bg-white">
      
      <div class="relative h-28 bg-gray-100 overflow-hidden">
        <img *ngIf="['PHOTO', 'CARTE', 'ARCHIVE_NUMERISEE', 'PANORAMA_360'].includes(rm.type) && rm.url"
             [src]="rm.url" [alt]="rm.nom" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
        <div *ngIf="rm.type === 'VIDEO'" class="w-full h-full bg-black flex items-center justify-center text-white">
          <i class="fas fa-play text-lg"></i>
        </div>
        <div *ngIf="rm.type === 'AUDIO'" class="w-full h-full bg-[#D16933]/10 flex items-center justify-center text-[#D16933]">
          <i class="fas fa-headphones text-2xl"></i>
        </div>
        <div *ngIf="rm.type === 'DOCUMENT'" class="w-full h-full bg-red-50 flex items-center justify-center text-red-500">
          <i class="fas fa-file-pdf text-2xl"></i>
        </div>

        <!-- Badge type miniature -->
        <span class="absolute top-2 left-2 bg-black/60 backdrop-blur-xs text-white text-[9px] font-bold px-2 py-0.5 rounded-md">
          {{ getTypeLabel(rm.type) }}
        </span>
      </div>

      <div class="p-2.5">
        <p class="font-bold text-gray-900 text-xs line-clamp-1 group-hover:text-[#0b5d5e] transition-colors mb-0.5">
          {{ rm.nom || 'Document' }}
        </p>
        <span class="text-[10px] text-gray-400 line-clamp-1">{{ rm.auteur || 'Archive officielle' }}</span>
      </div>

    </a>
  </div>
</div>
