<div *ngIf="patrimoine" class="bg-white rounded-3xl p-6 border border-gray-100 shadow-sm">
  <div class="text-[11px] font-bold uppercase tracking-wider text-[#D16933] mb-3 flex items-center gap-1.5">
    <i class="fas fa-landmark"></i>
    <span>Site culturel d'origine</span>
  </div>

  <div class="relative h-36 rounded-2xl overflow-hidden bg-gray-100 mb-4 shadow-inner">
    <img [src]="patrimoine.photoPrincipale?.urlPhotoPrincipale || '/assets/images/activite_saloum.jpg'"
         [alt]="patrimoine.nom" class="w-full h-full object-cover">
    <span *ngIf="patrimoine.inscritUnesco"
          class="absolute top-2 right-2 bg-blue-600 text-white text-[9px] font-black px-2 py-0.5 rounded-full shadow-sm">
      UNESCO
    </span>
  </div>

  <h3 class="font-serif text-lg font-bold text-gray-900 leading-snug mb-1">
    {{ patrimoine.nom }}
  </h3>

  <p class="text-xs text-gray-500 mb-4" *ngIf="patrimoine.region || patrimoine.commune">
    <i class="fa-solid fa-location-dot text-rose-500 mr-1"></i>{{ patrimoine.commune ? patrimoine.commune + ', ' : '' }}{{ patrimoine.region }}
  </p>

  <a [routerLink]="['/patrimoines', patrimoine.id]"
     class="w-full py-2.5 px-4 bg-gray-100 hover:bg-[#0b5d5e] hover:text-white text-gray-800 text-xs font-bold rounded-xl flex items-center justify-center gap-2 transition-all">
    <span>Explorer la fiche du site</span>
    <i class="fas fa-arrow-right text-[10px]"></i>
  </a>
</div>
