<div class="home-page">
  <!-- Alerte Backend Inaccessible -->
  <div *ngIf="backendError" class="bg-rose-600 text-white px-4 py-2.5 text-center text-xs sm:text-sm font-semibold flex items-center justify-center gap-2 shadow-sm">
    <i class="fa-solid fa-triangle-exclamation"></i>
    <span>Serveur backend non détecté ou inaccessible — Les données dynamiques ne peuvent pas être chargées.</span>
  </div>

  <!-- 1. HERO ACCUEIL -->
  <app-hero-accueil
    [heroImages]="heroImages"
    [currentHeroIndex]="currentHeroIndex"
    [(searchQuery)]="searchQuery"
    [unescoCount]="unescoCount"
    [regionsCount]="regionsCount"
    [totalMedias]="totalMedias"
    [totalContenus]="totalContenus"
    [patrimoinesLength]="patrimoines.length"
    (search)="onSearch()"
    (quickSearchEvent)="quickSearch($event)"
    (filterUnescoEvent)="filterUnesco()"
    (scrollToSectionEvent)="scrollToSection($event)"
    (goToCatalogueEvent)="goToCatalogue()">
  </app-hero-accueil>

  <!-- 2. BARRE DES CATÉGORIES -->
  <app-barre-categories></app-barre-categories>

  <!-- 3. CARROUSELS DE PATRIMOINES -->
  <app-carrousel-patrimoines
    [categoriesGroups]="categoriesGroups">
  </app-carrousel-patrimoines>

  <!-- 4. CARTE INTERACTIVE ACCUEIL -->
  <app-carte-interactive-accueil
    [patrimoines]="patrimoines">
  </app-carte-interactive-accueil>

  <!-- 5. CIRCUITS TOURISTIQUES -->
  <app-section-circuits
    [circuits]="circuits">
  </app-section-circuits>

  <!-- 6. CHRONIQUES ET RÉCITS -->
  <app-section-chroniques
    [recentContenus]="recentContenus"
    [patrimoines]="patrimoines"
    [allMedias]="allMedias">
  </app-section-chroniques>

  <!-- 6. ESPRIT TERANGA ET APPEL À L'ACTION -->
  <app-section-esprit-teranga></app-section-esprit-teranga>

</div>
