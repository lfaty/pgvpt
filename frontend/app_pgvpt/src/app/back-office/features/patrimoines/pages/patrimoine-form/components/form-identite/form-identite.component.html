<div [formGroup]="parentForm">
  
  <div class="grid-form">
    
    <!-- Nom -->
    <div class="full">
      <label>Nom officiel <span>*</span></label>
      <input type="text" formControlName="nom" placeholder="Ex: Île de Gorée">
    </div>

    <!-- Noms alternatifs -->
    <div>
      <label>Nom local</label>
      <input type="text" formControlName="nomLocal" placeholder="Nom en langue locale">
    </div>
    
    <div>
      <label>Nom historique</label>
      <input type="text" formControlName="nomHistorique" placeholder="Ancien nom du site">
    </div>

    <!-- Classification -->
    <div>
      <label>Type <span>*</span></label>
      <select formControlName="type">
        <option value="" disabled>Sélectionnez un type</option>
        <option value="SITE_NATUREL">Site Naturel</option>
        <option value="MUSEE">Musée</option>
        <option value="MONUMENT">Monument</option>
      </select>
    </div>

    <div>
      <label>Catégorie <span>*</span></label>
      <select formControlName="categorie">
        <option value="" disabled>Sélectionnez une catégorie</option>
        <option *ngFor="let cat of categories" [value]="cat.value">{{ cat.label }}</option>
      </select>
      <div *ngIf="isNaturel" class="notice" style="padding: 6px; font-size: 12px; margin-top: 5px;">
        Automatiquement fixé pour un Site Naturel.
      </div>
    </div>

    <div>
      <label>Sous-catégorie</label>
      <select formControlName="sousCategorie">
        <option value="">Sélectionnez une sous-catégorie</option>
        <option *ngFor="let sub of sousCategories" [value]="sub">{{ sub }}</option>
      </select>
    </div>

    <div>
      <label>Période</label>
      <select formControlName="periode">
        <option value="">Sélectionnez une période</option>
        <option *ngFor="let per of periodes" [value]="per.value">{{ per.label }}</option>
      </select>
      <div *ngIf="isNaturel" class="error">Non applicable aux sites naturels</div>
    </div>

    <div>
      <label>Siècle</label>
      <input type="text" formControlName="siecle" placeholder="Ex: XIXe siècle">
    </div>

  </div>
</div>
