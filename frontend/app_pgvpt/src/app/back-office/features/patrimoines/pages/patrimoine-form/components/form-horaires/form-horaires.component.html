<div [formGroup]="parentForm" class="bg-white rounded-xl relative z-10 shadow-sm border border-slate-200 p-6 md:p-8 mb-8 fade-in">
  
  <div class="mb-6 border-b border-slate-100 pb-4">
    <h2 class="text-lg font-bold text-slate-800">Horaires d'Ouverture</h2>
    <p class="text-sm text-slate-500 mt-1">Définissez les jours et heures d'ouverture du patrimoine</p>
  </div>

  <div formArrayName="horaires" class="space-y-4">
    
    <!-- Table Header for Desktop -->
    <div class="hidden md:grid grid-cols-12 gap-4 px-4 py-2 bg-slate-50 rounded-lg text-xs font-bold text-slate-600 uppercase tracking-wider">
      <div class="col-span-2">Jour</div>
      <div class="col-span-2">Ouvert ?</div>
      <div class="col-span-2">Ouverture</div>
      <div class="col-span-2">Fermeture</div>
      <div class="col-span-4">Notes / Réservation</div>
    </div>

    <!-- Daily Rows -->
    <div *ngFor="let jourForm of horairesFormArray.controls; let i = index" [formGroupName]="i" 
         class="grid relative z-10 grid-cols-1 md:grid-cols-12 gap-4 md:items-center p-4 border border-slate-200 rounded-xl hover:border-emerald-200 hover:shadow-sm transition-all"
         [ngClass]="{'bg-white': jourForm.get('ouvert')?.value, 'bg-slate-50/50 opacity-70': !jourForm.get('ouvert')?.value}">
      
      <!-- Jour (Label) -->
      <div class="md:col-span-2 font-bold text-slate-800 flex items-center">
        <span class="md:hidden text-xs text-slate-500 uppercase mr-2">Jour:</span>
        {{ joursSemaine[i].label }}
      </div>
      
      <!-- Ouvert (Toggle) -->
      <div class="md:col-span-2 flex items-center gap-2">
        <label class="relative inline-flex items-center cursor-pointer">
          <input type="checkbox" formControlName="ouvert" class="sr-only peer">
          <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-emerald-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-500"></div>
          <span class="ml-3 text-sm font-medium text-slate-700" *ngIf="jourForm.get('ouvert')?.value">Oui</span>
          <span class="ml-3 text-sm font-medium text-slate-400" *ngIf="!jourForm.get('ouvert')?.value">Fermé</span>
        </label>
      </div>
      
      <!-- Heure Ouverture -->
      <div class="md:col-span-2">
        <label class="md:hidden block text-xs font-semibold text-slate-600 mb-1">Ouverture</label>
        <input type="time" formControlName="heureOuverture" [attr.disabled]="!jourForm.get('ouvert')?.value ? true : null"
               class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 disabled:bg-slate-100 disabled:text-slate-400 transition-colors">
      </div>
      
      <!-- Heure Fermeture -->
      <div class="md:col-span-2">
        <label class="md:hidden block text-xs font-semibold text-slate-600 mb-1">Fermeture</label>
        <input type="time" formControlName="heureFermeture" [attr.disabled]="!jourForm.get('ouvert')?.value ? true : null"
               class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 disabled:bg-slate-100 disabled:text-slate-400 transition-colors">
      </div>
      
      <!-- Notes & Réservation -->
      <div class="md:col-span-4 flex flex-col sm:flex-row gap-3">
        <div class="flex-1">
          <label class="md:hidden block text-xs font-semibold text-slate-600 mb-1">Notes</label>
          <input type="text" formControlName="commentaire" placeholder="Ex: Pause 13h-14h..." [attr.disabled]="!jourForm.get('ouvert')?.value ? true : null"
                 class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 disabled:bg-slate-100 disabled:text-slate-400 transition-colors">
        </div>
        <div class="flex items-center gap-2 sm:mt-0 mt-2 whitespace-nowrap">
          <input type="checkbox" formControlName="surReservation" [attr.disabled]="!jourForm.get('ouvert')?.value ? true : null"
                 class="w-4 h-4 text-emerald-600 rounded border-slate-300 focus:ring-emerald-500 disabled:opacity-50">
          <label class="text-xs font-semibold text-slate-600" [ngClass]="{'opacity-50': !jourForm.get('ouvert')?.value}">Sur résa.</label>
        </div>
      </div>
      
    </div>
  </div>
</div>
