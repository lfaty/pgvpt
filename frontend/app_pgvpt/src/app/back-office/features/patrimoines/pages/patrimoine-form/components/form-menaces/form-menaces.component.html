<div [formGroup]="parentForm" class="bg-white rounded-xl relative z-10 shadow-sm border border-slate-200 p-6 md:p-8 mb-8 fade-in">
  
  <div class="mb-6 flex justify-between items-center border-b border-slate-100 pb-4">
    <div>
      <h2 class="text-lg font-bold text-slate-800">Menaces & Risques</h2>
      <p class="text-sm text-slate-500 mt-1">Identifiez les facteurs menaçant le patrimoine</p>
    </div>
    <button type="button" (click)="addMenace()" class="bg-indigo-50 text-indigo-700 hover:bg-indigo-100 px-4 py-2 rounded-lg text-sm font-semibold transition-colors flex items-center">
      <i class="fas fa-plus mr-2"></i> Ajouter une menace
    </button>
  </div>

  <div formArrayName="menaces">
    <!-- Empty State -->
    <div *ngIf="menacesArray.length === 0" class="text-center py-8 bg-slate-50 border border-dashed border-slate-300 rounded-xl mb-4">
      <i class="fas fa-shield-alt text-4xl text-slate-300 mb-3"></i>
      <h4 class="text-slate-600 font-medium mb-1">Aucune menace signalée</h4>
      <p class="text-slate-500 text-sm mb-4">Ajoutez les facteurs de risques qui pèsent sur ce site.</p>
      <button type="button" (click)="addMenace()" class="bg-white border border-slate-300 shadow-sm text-slate-700 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-slate-50 transition-colors">
        Ajouter une menace
      </button>
    </div>

    <!-- Menaces List -->
    <div class="space-y-4">
      <div *ngFor="let menaceCtrl of menacesArray.controls; let i = index" [formGroupName]="i" class="p-5 border border-rose-100 rounded-xl bg-rose-50/30 relative group">
        
        <button type="button" (click)="removeMenace(i)" class="absolute top-4 right-4 text-slate-400 hover:text-rose-500 transition-colors" title="Supprimer cette menace">
          <i class="fas fa-trash-alt"></i>
        </button>
        
        <div class="grid relative z-10 grid-cols-1 md:grid-cols-2 gap-5">
          
          <div class="md:col-span-1">
            <label class="block text-sm font-medium text-slate-700 mb-1">Type de menace <span class="text-rose-500">*</span></label>
            <input type="text" formControlName="type" placeholder="Ex: Érosion côtière, Braconnage..." class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors">
          </div>

          <div class="md:col-span-1">
            <label class="block text-sm font-medium text-slate-700 mb-1">Niveau de risque <span class="text-rose-500">*</span></label>
            <select formControlName="niveau" class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors">
              <option value="FAIBLE">Faible</option>
              <option value="MOYEN">Moyen</option>
              <option value="ELEVE">Élevé</option>
              <option value="CRITIQUE">Critique</option>
            </select>
          </div>

          <div class="md:col-span-2">
            <label class="block text-sm font-medium text-slate-700 mb-1">Description (Impacts)</label>
            <textarea formControlName="description" rows="2" placeholder="Décrivez l'impact de la menace sur le patrimoine..." class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors resize-none"></textarea>
          </div>

          <div class="md:col-span-2">
            <label class="block text-sm font-medium text-slate-700 mb-1">Mesures de prévention (Optionnel)</label>
            <textarea formControlName="mesuresPrevention" rows="2" placeholder="Ex: Construction de digues, patrouilles de surveillance..." class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors resize-none"></textarea>
          </div>

        </div>
      </div>
    </div>
  </div>

</div>
