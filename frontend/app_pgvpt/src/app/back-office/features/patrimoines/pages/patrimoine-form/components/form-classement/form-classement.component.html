<div [formGroup]="parentForm" class="bg-white rounded-xl relative z-10 shadow-sm border border-slate-200 p-6 md:p-8 mb-8 fade-in">
  
  <div class="mb-6 border-b border-slate-100 pb-4">
    <h2 class="text-lg font-bold text-slate-800">Classement & Reconnaissance</h2>
    <p class="text-sm text-slate-500 mt-1">Protections légales, classements nationaux et internationaux</p>
  </div>

  <div class="space-y-8">
    
    <!-- Classement National -->
    <div class="bg-slate-50 p-5 rounded-lg border border-slate-100">
      <div class="flex items-center gap-3 mb-4">
        <input type="checkbox" formControlName="classePatrimoine" id="classePatrimoine" class="w-5 h-5 text-emerald-600 rounded border-slate-300 focus:ring-emerald-500">
        <label for="classePatrimoine" class="font-bold text-slate-800 cursor-pointer">Classé au Patrimoine National</label>
      </div>
      
      <div class="grid relative z-10 grid-cols-1 md:grid-cols-2 gap-4" *ngIf="parentForm.get('classePatrimoine')?.value">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Référence du décret / Arrêté</label>
          <input type="text" formControlName="referenceClassement" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none" placeholder="N° du décret...">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Date de classement</label>
          <input type="date" formControlName="dateClassement" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none">
        </div>
      </div>
    </div>

    <!-- UNESCO -->
    <div class="bg-blue-50/50 p-5 rounded-lg border border-blue-100">
      <div class="flex items-center gap-3 mb-4">
        <input type="checkbox" formControlName="inscritUnesco" id="inscritUnesco" class="w-5 h-5 text-blue-600 rounded border-slate-300 focus:ring-blue-500">
        <label for="inscritUnesco" class="font-bold text-slate-800 cursor-pointer">Inscrit au Patrimoine Mondial de l'UNESCO</label>
      </div>
      
      <div class="grid relative z-10 grid-cols-1 md:grid-cols-2 gap-4" *ngIf="parentForm.get('inscritUnesco')?.value">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Nom officiel sous lequel il est inscrit</label>
          <input type="text" formControlName="nomSiteUnesco" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none" placeholder="Ex: Île de Gorée">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Année / Date d'inscription</label>
          <input type="text" formControlName="dateInscriptionUnesco" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none" placeholder="Ex: 1978">
        </div>
      </div>
    </div>

    <!-- Protection Légale -->
    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-2">Mesures de protection juridique</label>
      <textarea formControlName="protectionJuridique" rows="3" class="w-full px-4 py-2 border border-slate-300 rounded-lg text-slate-800 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none resize-none" placeholder="Lois applicables, zones tampons, interdictions..."></textarea>
    </div>

  </div>
</div>
