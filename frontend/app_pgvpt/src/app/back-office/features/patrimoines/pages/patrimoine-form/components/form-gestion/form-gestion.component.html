<div [formGroup]="parentForm" class="bg-white rounded-xl relative z-10 shadow-sm border border-slate-200 p-6 md:p-8 mb-8 fade-in">
  
  <div class="mb-6 border-b border-slate-100 pb-4">
    <h2 class="text-lg font-bold text-slate-800">Gestion & Contact</h2>
    <p class="text-sm text-slate-500 mt-1">Informations sur les responsables et les contacts</p>
  </div>

  <div class="grid relative z-10 grid-cols-1 md:grid-cols-2 gap-6">
    
    <!-- Statut -->
    <div class="md:col-span-2">
      <label class="block text-sm font-semibold text-slate-700 mb-2">Statut de publication</label>
      <select formControlName="statut" class="w-full md:w-1/2 px-4 py-2 border border-slate-300 rounded-lg text-slate-800 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none bg-white">
        <option value="BROUILLON">Brouillon</option>
        <option value="EN_VALIDATION">En Validation</option>
        <option value="VALIDE">Validé</option>
        <option value="PUBLIE">Publié</option>
        <option value="ARCHIVE">Archivé</option>
      </select>
    </div>

    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-2">Organisme Gestionnaire</label>
      <input type="text" formControlName="organismeGestionnaire" class="w-full px-4 py-2 border border-slate-300 rounded-lg text-slate-800 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none" placeholder="Ex: Ministère de la Culture">
    </div>

    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-2">Propriétaire</label>
      <input type="text" formControlName="proprietaire" class="w-full px-4 py-2 border border-slate-300 rounded-lg text-slate-800 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none" placeholder="Ex: État, Privé, Commune...">
    </div>

    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-2">Nom du contact / Gestionnaire</label>
      <input type="text" formControlName="gestionnaire" class="w-full px-4 py-2 border border-slate-300 rounded-lg text-slate-800 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none" placeholder="Personne à contacter">
    </div>

    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-2">Date d'ouverture au public</label>
      <input type="date" formControlName="dateOuverture" class="w-full px-4 py-2 border border-slate-300 rounded-lg text-slate-800 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none">
    </div>

    <div class="md:col-span-2 border-t border-slate-100 pt-6 mt-2">
      <h3 class="text-sm font-bold text-slate-800 mb-4">Coordonnées de contact</h3>
      <div class="grid relative z-10 grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Téléphone</label>
          <div class="relative">
            <span class="absolute left-3 top-2.5 text-slate-400"><i class="fas fa-phone"></i></span>
            <input type="text" formControlName="telephone" class="w-full pl-9 pr-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Email</label>
          <div class="relative">
            <span class="absolute left-3 top-2.5 text-slate-400"><i class="fas fa-envelope"></i></span>
            <input type="email" formControlName="email" class="w-full pl-9 pr-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Site Web</label>
          <div class="relative">
            <span class="absolute left-3 top-2.5 text-slate-400"><i class="fas fa-globe"></i></span>
            <input type="url" formControlName="siteWeb" class="w-full pl-9 pr-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none" placeholder="https://...">
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
