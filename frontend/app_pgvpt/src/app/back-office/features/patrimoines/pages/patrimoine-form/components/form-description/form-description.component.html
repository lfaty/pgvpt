<div [formGroup]="parentForm">
  <div class="grid-form">
    <div class="full">
      <label>Description courte <span>*</span></label>
      <div class="notice" style="padding: 5px; margin-top: -5px; margin-bottom: 5px; font-size: 12px;">Sera affichée dans les listes et les cartes (Max 250 caractères).</div>
      <textarea formControlName="descriptionCourte" placeholder="Bref résumé du patrimoine..."></textarea>
    </div>

    <div class="full">
      <label>Description détaillée <span>*</span></label>
      <div class="notice" style="padding: 5px; margin-top: -5px; margin-bottom: 5px; font-size: 12px;">Texte complet présentant le site, son architecture, son histoire générale...</div>
      <textarea formControlName="description" placeholder="Description complète..."></textarea>
    </div>
  </div>
</div>
