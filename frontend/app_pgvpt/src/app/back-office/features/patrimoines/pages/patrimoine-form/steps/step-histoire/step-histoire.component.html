<section [formGroup]="form" class="space-y-6 animate-fade-in">
  <div class="border-b border-gray-100 pb-3">
    <h2 class="text-base font-bold text-gray-900 flex items-center gap-2">
      <i class="fas fa-book-open text-[#0b5d5e]"></i>
      <span>3. Histoire & culture</span>
    </h2>
    <p class="text-xs text-gray-500 mt-0.5">Valeurs mémorielles et traditions immatérielles.</p>
  </div>
  <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
    <div class="md:col-span-2">
      <label class="block text-xs font-bold text-gray-700 mb-1.5">Historique</label>
      <textarea formControlName="historique" rows="4" placeholder="Origine et évolution historique..."
        class="w-full px-3.5 py-2.5 text-xs bg-gray-50 border border-gray-200 rounded-xl text-gray-800 focus:outline-none focus:ring-1 focus:ring-[#0b5d5e] focus:border-[#0b5d5e]"></textarea>
    </div>
    <div>
      <label class="block text-xs font-bold text-gray-700 mb-1.5">Importance historique</label>
      <textarea formControlName="importanceHistorique" rows="3" placeholder="Rôle historique..."
        class="w-full px-3.5 py-2.5 text-xs bg-gray-50 border border-gray-200 rounded-xl text-gray-800 focus:outline-none focus:ring-1 focus:ring-[#0b5d5e] focus:border-[#0b5d5e]"></textarea>
    </div>
    <div>
      <label class="block text-xs font-bold text-gray-700 mb-1.5">Importance culturelle</label>
      <textarea formControlName="importanceCulturelle" rows="3" placeholder="Symbolisme culturel..."
        class="w-full px-3.5 py-2.5 text-xs bg-gray-50 border border-gray-200 rounded-xl text-gray-800 focus:outline-none focus:ring-1 focus:ring-[#0b5d5e] focus:border-[#0b5d5e]"></textarea>
    </div>
    <div>
      <label class="block text-xs font-bold text-gray-700 mb-1.5">Valeur Patrimoniale</label>
      <textarea formControlName="valeurPatrimoniale" rows="3" placeholder="Portée patrimoniale..."
        class="w-full px-3.5 py-2.5 text-xs bg-gray-50 border border-gray-200 rounded-xl text-gray-800 focus:outline-none focus:ring-1 focus:ring-[#0b5d5e] focus:border-[#0b5d5e]"></textarea>
    </div>
    <div>
      <label class="block text-xs font-bold text-gray-700 mb-1.5">Valeur Spirituelle</label>
      <textarea formControlName="valeurSpirituelle" rows="3" placeholder="Signification religieuse ou rituelle..."
        class="w-full px-3.5 py-2.5 text-xs bg-gray-50 border border-gray-200 rounded-xl text-gray-800 focus:outline-none focus:ring-1 focus:ring-[#0b5d5e] focus:border-[#0b5d5e]"></textarea>
    </div>
    <div class="md:col-span-2">
      <label class="block text-xs font-bold text-gray-700 mb-1.5">Importance Touristique</label>
      <textarea formControlName="importanceTouristique" rows="3" placeholder="Potentiel et attractivité touristique..."
        class="w-full px-3.5 py-2.5 text-xs bg-gray-50 border border-gray-200 rounded-xl text-gray-800 focus:outline-none focus:ring-1 focus:ring-[#0b5d5e] focus:border-[#0b5d5e]"></textarea>
    </div>

    <div>
      <label class="block text-xs font-bold text-gray-700 mb-1.5">Traditions associées</label>
      <app-tag-input formControlName="traditionsAssociees" badgeColor="amber" placeholder="Ajouter une tradition (ex: Rituels, Célébrations, Chants)..."></app-tag-input>
    </div>
    <div>
      <label class="block text-xs font-bold text-gray-700 mb-1.5">Langues parlées</label>
      <app-tag-input formControlName="langues" badgeColor="teal" placeholder="Ajouter une langue (ex: Wolof, Français, Sérère)..."></app-tag-input>
    </div>
  </div>

  <!-- Navigation de bas d'étape 3 -->
  <div class="pt-4 border-t border-gray-100 flex items-center justify-between">
    <button type="button" (click)="onPrev()"
      class="px-4 py-2 text-xs font-semibold text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-xl transition-colors flex items-center gap-1.5">
      <i class="fas fa-arrow-left text-[10px]"></i>
      <span>Précédent</span>
    </button>
    <button type="button" (click)="onNext()"
      class="px-5 py-2.5 bg-[#0b5d5e] hover:bg-[#084b4c] text-white text-xs font-semibold rounded-xl shadow-sm transition-all flex items-center gap-2">
      <span>Suivant : 4. Protection</span>
      <i class="fas fa-arrow-right text-[10px]"></i>
    </button>
  </div>
</section>
