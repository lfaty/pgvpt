<div [formGroup]="parentForm" class="bg-white rounded-xl relative z-10 shadow-sm border border-slate-200 p-6 md:p-8 mb-8 fade-in">
  
  <div class="mb-6 border-b border-slate-100 pb-4">
    <h2 class="text-lg font-bold text-slate-800">État de Conservation</h2>
    <p class="text-sm text-slate-500 mt-1">Évaluation de l'état actuel et travaux nécessaires</p>
  </div>

  <div formGroupName="conservation" class="space-y-8">
    
    <!-- État Général -->
    <div class="grid relative z-10 grid-cols-1 md:grid-cols-2 gap-6 bg-slate-50 p-5 rounded-xl border border-slate-100">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">État Général</label>
        <select formControlName="etat" class="w-full px-4 py-2 border border-slate-300 rounded-lg text-slate-800 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none bg-white">
          <option value="EXCELLENT">🟢 Excellent</option>
          <option value="BON">🔵 Bon</option>
          <option value="MOYEN">🟡 Moyen</option>
          <option value="MAUVAIS">🟠 Mauvais</option>
          <option value="CRITIQUE">🔴 Critique</option>
          <option value="RUINE">⚫ Ruine</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">Date de dernière évaluation</label>
        <input type="date" formControlName="dateEvaluation" class="w-full px-4 py-2 border border-slate-300 rounded-lg text-slate-800 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none">
      </div>

      <div class="md:col-span-2">
        <label class="block text-sm font-semibold text-slate-700 mb-2">Description détaillée de l'état</label>
        <textarea formControlName="descriptionEtat" rows="3" class="w-full px-4 py-2 border border-slate-300 rounded-lg text-slate-800 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none resize-none" placeholder="Décrivez les dégradations éventuelles..."></textarea>
      </div>
    </div>

    <!-- Travaux -->
    <div class="grid relative z-10 grid-cols-1 md:grid-cols-2 gap-6">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">Derniers travaux effectués</label>
        <textarea formControlName="dernierTravaux" rows="2" class="w-full px-4 py-2 border border-slate-300 rounded-lg text-slate-800 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none resize-none" placeholder="Nature des travaux passés"></textarea>
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">Date des derniers travaux</label>
        <input type="date" formControlName="dateDerniersTravaux" class="w-full px-4 py-2 border border-slate-300 rounded-lg text-slate-800 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none">
      </div>
    </div>

  </div>
</div>
