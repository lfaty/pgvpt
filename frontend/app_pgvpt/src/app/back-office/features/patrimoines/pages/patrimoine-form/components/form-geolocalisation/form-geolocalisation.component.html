<div [formGroup]="parentForm" class="bg-white rounded-xl relative z-10 shadow-sm border border-slate-200 p-6 md:p-8 mb-8 fade-in">
  
  <div class="mb-6 border-b border-slate-100 pb-4">
    <h2 class="text-lg font-bold text-slate-800">Géolocalisation & Adresse</h2>
    <p class="text-sm text-slate-500 mt-1">Coordonnées GPS et localisation exacte</p>
  </div>

  <!-- ─── RATTACHEMENT TERRITORIAL ─── -->
  <div class="bg-indigo-50/50 rounded-xl p-5 border border-indigo-100 mb-6">
    <h3 class="font-bold text-indigo-800 mb-4 flex items-center gap-2"><i class="fas fa-map text-indigo-500"></i> Rattachement Territorial</h3>
    <div class="grid relative z-10 grid-cols-1 md:grid-cols-3 gap-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Zone Touristique <span class="text-red-500">*</span></label>
        <input type="text" formControlName="zoneTouristiqueId" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm outline-none focus:border-indigo-500" placeholder="Zone touristique">
        <p class="text-[10px] text-slate-400 mt-1">Requis pour le zonage géographique</p>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Village (Optionnel)</label>
        <input type="text" formControlName="villageId" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm outline-none focus:border-indigo-500" placeholder="Nom ou code du village">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Quartier (Optionnel)</label>
        <input type="text" formControlName="quartierId" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm outline-none focus:border-indigo-500" placeholder="Nom ou code du quartier">
      </div>
    </div>
  </div>

  <div class="grid relative z-10 grid-cols-1 md:grid-cols-2 gap-6 mb-6">
    
    <div class="md:col-span-2">
      <label class="block text-sm font-semibold text-slate-700 mb-2">Adresse complète</label>
      <textarea formControlName="adresse" rows="2" class="w-full px-4 py-2 border border-slate-300 rounded-lg text-slate-800 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none resize-none" placeholder="Numéro, rue, ville..."></textarea>
    </div>

    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-2">Lieu-dit / Quartier</label>
      <input type="text" formControlName="lieuDit" class="w-full px-4 py-2 border border-slate-300 rounded-lg text-slate-800 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none" placeholder="Précision sur la zone">
    </div>

    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-2">Point de repère</label>
      <input type="text" formControlName="repere" class="w-full px-4 py-2 border border-slate-300 rounded-lg text-slate-800 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none" placeholder="À côté de...">
    </div>

  </div>

  <!-- Map and GPS -->
  <div class="bg-slate-50 rounded-xl p-5 border border-slate-200">
    <h3 class="font-bold text-slate-700 mb-4 flex items-center gap-2"><i class="fas fa-map-marker-alt text-rose-500"></i> Coordonnées GPS</h3>
    
    <div class="grid relative z-10 grid-cols-1 md:grid-cols-4 gap-4">
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Latitude <span class="text-red-500">*</span></label>
        <input type="number" formControlName="latitude" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none" placeholder="Ex: 14.667">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Longitude <span class="text-red-500">*</span></label>
        <input type="number" formControlName="longitude" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none" placeholder="Ex: -17.398">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Altitude (m)</label>
        <input type="number" formControlName="altitude" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none" placeholder="Ex: 15">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Précision (m)</label>
        <input type="number" formControlName="precisionMetres" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none" placeholder="Ex: 5">
      </div>

      <!-- Ligne 2 : Métadonnées GPS -->
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Système Réf.</label>
        <input type="text" formControlName="systemeReference" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none" placeholder="WGS84">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Code EPSG</label>
        <input type="number" formControlName="codeEpsg" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none" placeholder="4326">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Source</label>
        <select formControlName="source" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none bg-white">
          <option value="">Sélectionner</option>
          <option value="GPS">GPS</option>
          <option value="ADMINISTRATION">Administration</option>
          <option value="SIG">SIG</option>
          <option value="OPEN_DATA">Open Data</option>
          <option value="IMPORT">Import</option>
          <option value="AUTRE">Autre</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Date Acquisition</label>
        <input type="date" formControlName="dateAcquisition" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none">
      </div>

      <!-- Ligne 3 : Fiabilité -->
      <div class="md:col-span-2">
        <label class="block text-xs font-semibold text-slate-600 mb-1">Méthode d'Acquisition</label>
        <select formControlName="methodeAcquisition" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none bg-white">
          <option value="">Sélectionner</option>
          <option value="GPS">GPS</option>
          <option value="RELEVE_TERRAIN">Relevé Terrain</option>
          <option value="SATELLITE">Satellite</option>
          <option value="DRONE">Drone</option>
          <option value="GEOCODAGE">Géocodage</option>
          <option value="IMPORT_SIG">Import SIG</option>
          <option value="AUTRE">Autre</option>
        </select>
      </div>
      <div class="md:col-span-2">
        <label class="block text-xs font-semibold text-slate-600 mb-1">Niveau de Fiabilité</label>
        <select formControlName="niveauFiabilite" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none bg-white">
          <option value="">Sélectionner</option>
          <option value="FAIBLE">Faible</option>
          <option value="MOYEN">Moyen</option>
          <option value="ELEVE">Élevé</option>
          <option value="TRES_ELEVE">Très Élevé</option>
        </select>
      </div>
    </div>
  </div>

</div>
