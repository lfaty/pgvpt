<div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm space-y-3 font-sans">
  <div class="flex flex-col md:flex-row items-stretch md:items-center justify-between gap-3">

    <!-- Recherche textuelle -->
    <div class="relative flex-1">
      <i class="fas fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-xs pointer-events-none"></i>
      <input type="text" [ngModel]="searchQuery" (ngModelChange)="onSearchChange($event)"
        placeholder="Rechercher par nom, ville, région ou référence..."
        class="w-full pl-9 pr-9 py-2 text-xs bg-gray-50 border border-gray-200 rounded-xl text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-[#0b5d5e] focus:border-[#0b5d5e] focus:bg-white transition-all">
      <button *ngIf="searchQuery" (click)="clearSearch()" type="button"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 text-xs">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <!-- Contrôles à droite : Bouton Filtres, Effacer & Bascules Vue -->
    <div class="flex items-center justify-end gap-2 shrink-0">
      <!-- Bouton Filtres Avancés -->
      <button type="button" (click)="toggleAdvancedFilters()"
        class="px-3 py-2 text-xs font-semibold rounded-xl border transition-colors flex items-center gap-1.5 cursor-pointer"
        [ngClass]="showAdvancedFilters || activeFiltersCount > 0 ? 'bg-[#0b5d5e]/5 text-[#0b5d5e] border-[#0b5d5e]/30' : 'bg-gray-50 text-gray-600 border-gray-200 hover:bg-gray-100'">
        <i class="fas fa-sliders-h text-xs"></i>
        <span>Filtres</span>
        <span *ngIf="activeFiltersCount > 0" class="ml-1 px-1.5 py-0.2 rounded-full text-[10px] font-bold bg-[#0b5d5e] text-white">
          {{ activeFiltersCount }}
        </span>
      </button>

      <!-- Effacer filtres -->
      <button *ngIf="hasActiveFilters" (click)="onReset()" type="button"
        class="px-3 py-2 text-xs font-semibold text-rose-600 hover:bg-rose-50 rounded-xl transition-colors flex items-center gap-1.5 cursor-pointer">
        <i class="fas fa-times text-xs"></i>
        <span>Effacer</span>
      </button>

      <!-- Toggle Affichage : Liste / Grille -->
      <div class="flex items-center bg-gray-100 p-1 rounded-xl">
        <button type="button" (click)="setViewMode('list')"
          class="p-1.5 rounded-lg text-xs transition-all cursor-pointer"
          [ngClass]="viewMode === 'list' ? 'bg-white text-[#0b5d5e] shadow-sm font-bold' : 'text-gray-400 hover:text-gray-700'"
          title="Vue Tableau">
          <i class="fas fa-list-ul w-4 text-center"></i>
        </button>
        <button type="button" (click)="setViewMode('grid')"
          class="p-1.5 rounded-lg text-xs transition-all cursor-pointer"
          [ngClass]="viewMode === 'grid' ? 'bg-white text-[#0b5d5e] shadow-sm font-bold' : 'text-gray-400 hover:text-gray-700'"
          title="Vue Cartes">
          <i class="fas fa-th-large w-4 text-center"></i>
        </button>
      </div>
    </div>

  </div>

  <!-- Tiroir des filtres avancés (dépliable) -->
  <div *ngIf="showAdvancedFilters" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 pt-3 border-t border-gray-100 animate-slide-up">
    
    <!-- Région -->
    <div class="flex items-center gap-2 bg-gray-50 px-3 py-2 rounded-xl border border-gray-100">
      <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wide">Région :</span>
      <select [ngModel]="selectedRegion" (ngModelChange)="onRegionChange($event)"
        class="w-full text-xs font-semibold bg-transparent border-0 text-gray-700 focus:outline-none cursor-pointer">
        <option value="TOUTES">Toutes les régions</option>
        <option value="Dakar">Dakar</option>
        <option value="Saint-Louis">Saint-Louis</option>
        <option value="Fatick">Fatick (Saloum)</option>
        <option value="Thiès">Thiès</option>
        <option value="Ziguinchor">Ziguinchor (Casamance)</option>
        <option value="Tambacounda">Tambacounda</option>
        <option value="Kaolack">Kaolack</option>
        <option value="Kédougou">Kédougou</option>
        <option value="Louga">Louga</option>
        <option value="Matam">Matam</option>
        <option value="Kolda">Kolda</option>
        <option value="Sédhiou">Sédhiou</option>
        <option value="Kaffrine">Kaffrine</option>
        <option value="Diourbel">Diourbel</option>
      </select>
    </div>

    <!-- Type -->
    <div class="flex items-center gap-2 bg-gray-50 px-3 py-2 rounded-xl border border-gray-100">
      <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wide">Type :</span>
      <select [ngModel]="selectedType" (ngModelChange)="onTypeChange($event)"
        class="w-full text-xs font-semibold bg-transparent border-0 text-gray-700 focus:outline-none cursor-pointer">
        <option value="TOUS">Tous les types</option>
        <option value="MONUMENT">Monument Historique</option>
        <option value="SITE_NATUREL">Site Naturel</option>
        <option value="MUSEE">Musée National</option>
        <option value="SITE_ARCHEOLOGIQUE">Site Archéologique</option>
      </select>
    </div>

    <!-- Catégorie -->
    <div class="flex items-center gap-2 bg-gray-50 px-3 py-2 rounded-xl border border-gray-100">
      <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wide">Catégorie :</span>
      <select [ngModel]="selectedCategorie" (ngModelChange)="onCategorieChange($event)"
        class="w-full text-xs font-semibold bg-transparent border-0 text-gray-700 focus:outline-none cursor-pointer">
        <option value="TOUTES">Toutes les catégories</option>
        <option value="PATRIMOINE_NATUREL">Patrimoine Naturel</option>
        <option value="PATRIMOINE_HISTORIQUE">Patrimoine Historique</option>
        <option value="PATRIMOINE_CULTUREL">Patrimoine Culturel</option>
        <option value="PATRIMOINE_ARCHITECTURAL">Patrimoine Architectural</option>
        <option value="PATRIMOINE_RELIGIEUX">Patrimoine Religieux</option>
        <option value="PATRIMOINE_COLONIAL">Patrimoine Colonial</option>
        <option value="PATRIMOINE_ARCHEOLOGIQUE">Patrimoine Archéologique</option>
        <option value="PATRIMOINE_MUSEAL">Patrimoine Muséal</option>
        <option value="PATRIMOINE_MEMORIEL">Patrimoine Mémoriel</option>
        <option value="PATRIMOINE_MARITIME">Patrimoine Maritime</option>
        <option value="PATRIMOINE_RURAL">Patrimoine Rural</option>
        <option value="AUTRE">Autre</option>
      </select>
    </div>

    <!-- État Conservation -->
    <div class="flex items-center gap-2 bg-gray-50 px-3 py-2 rounded-xl border border-gray-100">
      <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wide">État :</span>
      <select [ngModel]="selectedEtatConservation" (ngModelChange)="onEtatConservationChange($event)"
        class="w-full text-xs font-semibold bg-transparent border-0 text-gray-700 focus:outline-none cursor-pointer">
        <option value="TOUS">Tous les états</option>
        <option value="EXCELLENT">Excellent</option>
        <option value="BON">Bon</option>
        <option value="MOYEN">Moyen</option>
        <option value="MAUVAIS">Mauvais</option>
        <option value="CRITIQUE">Critique</option>
        <option value="RUINE">En ruine</option>
      </select>
    </div>

    <!-- Statut -->
    <div class="flex items-center gap-2 bg-gray-50 px-3 py-2 rounded-xl border border-gray-100">
      <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wide">Statut :</span>
      <select [ngModel]="selectedStatut" (ngModelChange)="onStatutChange($event)"
        class="w-full text-xs font-semibold bg-transparent border-0 text-gray-700 focus:outline-none cursor-pointer">
        <option value="TOUS">Tous les statuts</option>
        <option value="PUBLIE">Publié</option>
        <option value="EN_VALIDATION">En validation</option>
        <option value="BROUILLON">Brouillon</option>
      </select>
    </div>

    <!-- Accès Public -->
    <div class="flex items-center gap-2 bg-gray-50 px-3 py-2 rounded-xl border border-gray-100">
      <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wide">Accès :</span>
      <select [ngModel]="accessiblePublic" (ngModelChange)="onAccessiblePublicChange($event)"
        class="w-full text-xs font-semibold bg-transparent border-0 text-gray-700 focus:outline-none cursor-pointer">
        <option value="TOUS">Tous</option>
        <option value="true">Ouvert au public</option>
        <option value="false">Fermé au public</option>
      </select>
    </div>

    <!-- Inscrit UNESCO -->
    <div class="flex items-center gap-2 bg-gray-50 px-3 py-2 rounded-xl border border-gray-100">
      <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wide">UNESCO :</span>
      <select [ngModel]="inscritUnesco" (ngModelChange)="onInscritUnescoChange($event)"
        class="w-full text-xs font-semibold bg-transparent border-0 text-gray-700 focus:outline-none cursor-pointer">
        <option value="TOUS">Tous</option>
        <option value="true">Inscrit UNESCO</option>
        <option value="false">Non Inscrit</option>
      </select>
    </div>

    <!-- Classé Patrimoine -->
    <div class="flex items-center gap-2 bg-gray-50 px-3 py-2 rounded-xl border border-gray-100">
      <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wide">Classé :</span>
      <select [ngModel]="classePatrimoine" (ngModelChange)="onClassePatrimoineChange($event)"
        class="w-full text-xs font-semibold bg-transparent border-0 text-gray-700 focus:outline-none cursor-pointer">
        <option value="TOUS">Tous</option>
        <option value="true">Classé national</option>
        <option value="false">Non Classé</option>
      </select>
    </div>

  </div>
</div>
