<div class="card" [routerLink]="['/patrimoines', patrimoine.id]">
  
  <!-- Image Container -->
  <div class="card-image">
    <img [src]="patrimoine.images[0]" [alt]="patrimoine.nom" class="card-img">
    
    <!-- Hover overlay -->
    <div class="card-image-overlay"></div>

    <!-- Category Badge -->
    <div class="badge-top-left">
      <span class="category-badge"
            [class.badge-historique]="patrimoine.type === 'HISTORIQUE'"
            [class.badge-naturel]="patrimoine.type === 'NATUREL'"
            [class.badge-culturel]="patrimoine.type === 'CULTUREL'">
        {{ patrimoine.categorie }}
      </span>
    </div>
    
    <!-- Rating Badge -->
    <div *ngIf="patrimoine.note" class="badge-top-right">
      <div class="rating-badge">
        <svg class="star-icon" fill="currentColor" viewBox="0 0 20 20">
          <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
        </svg>
        <span class="rating-text">{{ patrimoine.note }}</span>
      </div>
    </div>
  </div>

  <!-- Content -->
  <div class="card-body">
    
    <!-- Location -->
    <div class="card-location">
      <svg class="location-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
      <span>{{ patrimoine.localisation.region }}, {{ patrimoine.localisation.departement }}</span>
    </div>

    <!-- Title & Description -->
    <h3 class="card-title">{{ patrimoine.nom }}</h3>
    <p class="card-description">{{ patrimoine.description }}</p>

    <!-- Action -->
    <div class="card-footer">
      <span class="card-link-text">Découvrir le site</span>
      <div class="card-link-arrow">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7" />
        </svg>
      </div>
    </div>
    
  </div>
</div>
