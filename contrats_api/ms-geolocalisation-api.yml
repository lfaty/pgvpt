  /geolocalisations/recherche:
    get:
      tags:
      - Geospatial
      summary: Rechercher les ressources géolocalisées selon plusieurs critères
      operationId: searchGeolocalisations
      parameters:
      - name: latitude
        in: query
        schema:
          type: number
          format: double
          minimum: -90
          maximum: 90
      - name: longitude
        in: query
        schema:
          type: number
          format: double
          minimum: -180
          maximum: 180
      - name: rayonKm
        in: query
        schema:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
      - name: minLatitude
        in: query
        schema:
          type: number
          format: double
          minimum: -90
          maximum: 90
      - name: maxLatitude
        in: query
        schema:
          type: number
          format: double
          minimum: -90
          maximum: 90
      - name: minLongitude
        in: query
        schema:
          type: number
          format: double
          minimum: -180
          maximum: 180
      - name: maxLongitude
        in: query
        schema:
          type: number
          format: double
          minimum: -180
          maximum: 180
      - name: localite
        in: query
        schema:
          type: string
      - name: motCle
        in: query
        schema:
          type: string
      - name: typePatrimoine
        in: query
        schema:
          $ref: '#/components/schemas/TypePatrimoine'
      - name: categorie
        in: query
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Résultats de recherche
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagePatrimoineGeographique'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  parameters:
    PaysId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RegionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DepartementId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommuneId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VillageId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QuartierId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GeolocalisationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PatrimoineId:
      name: patrimoineId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PointAccesId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ZoneGeographiqueId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ZoneTouristiqueId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      description: Numéro de page, indexé à partir de 0.
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Nombre maximal d’éléments par page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: Requête invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Conflit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Authentification requise
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Accès interdit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InternalServerError:
      description: Erreur interne du serveur
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UnprocessableEntity:
      description: Erreur de validation métier
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    BaseEntity:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      description: Classe racine commune de toutes les entités persistantes du PGVPT.
    Geolocalisation:
      allOf:
      - $ref: '#/components/schemas/BaseEntity'
      - type: object
        required:
        - id
        - latitude
        - longitude
        properties:
          latitude:
            type: number
            format: double
            minimum: -90
            maximum: 90
          longitude:
            type: number
            format: double
            minimum: -180
            maximum: 180
          altitude:
            type: number
            format: double
          precisionMetres:
            type: number
            format: double
            minimum: 0
          adresse:
            type: string
          lieuDit:
            type: string
          repere:
            type: string
          systemeReference:
            type: string
            default: WGS84
            example: WGS84
          codeEpsg:
            type: integer
            default: 4326
            example: 4326
          source:
            type: string
            enum:
            - GPS
            - ADMINISTRATION
            - SIG
            - OPEN_DATA
            - IMPORT
            - AUTRE
            description: Origine de la donnée de géolocalisation.
          dateAcquisition:
            type: string
            format: date
          methodeAcquisition:
            type: string
            enum:
            - GPS
            - RELEVE_TERRAIN
            - SATELLITE
            - DRONE
            - GEOCODAGE
            - IMPORT_SIG
            - AUTRE
          niveauFiabilite:
            type: string
            enum:
            - FAIBLE
            - MOYEN
            - ELEVE
            - TRES_ELEVE
          zoneTouristiqueId:
            type: string
            format: uuid
          villageId:
            type: string
            format: uuid
            nullable: true
          quartierId:
            type: string
            format: uuid
            nullable: true
          patrimoineId:
            type: string
            format: uuid
            nullable: true
            description: Identifiant du patrimoine provenant de ms-patrimoine.
          entrepriseId:
            type: string
            format: uuid
            nullable: true
            description: Identifiant de l'entreprise provenant de ms-entreprise.
        oneOf:
        - required:
          - patrimoineId
          not:
            required:
            - entrepriseId
        - required:
          - entrepriseId
          not:
            required:
            - patrimoineId
        description: 'Entité persistante décrivant la localisation d''une ressource géolocalisable. Elle hérite de BaseEntity.
          Une géolocalisation est associée à exactement une ressource : soit un patrimoine provenant de ms-patrimoine, soit
          une entreprise provenant de ms-entreprise.'
    GeolocalisationCreate:
      type: object
      required:
      - latitude
      - longitude
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        altitude:
          type: number
          format: double
        precisionMetres:
          type: number
          format: double
          minimum: 0
        adresse:
          type: string
        lieuDit:
          type: string
        repere:
          type: string
        systemeReference:
          type: string
          default: WGS84
          example: WGS84
        codeEpsg:
          type: integer
          default: 4326
          example: 4326
        source:
          type: string
          enum:
          - GPS
          - ADMINISTRATION
          - SIG
          - OPEN_DATA
          - IMPORT
          - AUTRE
          description: Origine de la donnée de géolocalisation.
        dateAcquisition:
          type: string
          format: date
        methodeAcquisition:
          type: string
          enum:
          - GPS
          - RELEVE_TERRAIN
          - SATELLITE
          - DRONE
          - GEOCODAGE
          - IMPORT_SIG
          - AUTRE
        niveauFiabilite:
          type: string
          enum:
          - FAIBLE
          - MOYEN
          - ELEVE
          - TRES_ELEVE
        zoneTouristiqueId:
          type: string
          format: uuid
        villageId:
          type: string
          format: uuid
          nullable: true
        quartierId:
          type: string
          format: uuid
          nullable: true
        patrimoineId:
          type: string
          format: uuid
          nullable: true
          description: Identifiant du patrimoine provenant de ms-patrimoine.
        entrepriseId:
          type: string
          format: uuid
          nullable: true
          description: Identifiant de l'entreprise provenant de ms-entreprise.
      oneOf:
      - required:
        - patrimoineId
        not:
          required:
          - entrepriseId
      - required:
        - entrepriseId
        not:
          required:
          - patrimoineId
      description: 'Une géolocalisation doit référencer exactement une ressource : un patrimoine ou une entreprise.'
    GeolocalisationUpdate:
      type: object
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        altitude:
          type: number
          format: double
        precisionMetres:
          type: number
          format: double
          minimum: 0
        adresse:
          type: string
        lieuDit:
          type: string
        repere:
          type: string
        systemeReference:
          type: string
          default: WGS84
          example: WGS84
        codeEpsg:
          type: integer
          default: 4326
          example: 4326
        source:
          type: string
          enum:
          - GPS
          - ADMINISTRATION
          - SIG
          - OPEN_DATA
          - IMPORT
          - AUTRE
          description: Origine de la donnée de géolocalisation.
        dateAcquisition:
          type: string
          format: date
        methodeAcquisition:
          type: string
          enum:
          - GPS
          - RELEVE_TERRAIN
          - SATELLITE
          - DRONE
          - GEOCODAGE
          - IMPORT_SIG
          - AUTRE
        niveauFiabilite:
          type: string
