openapi: 3.0.3
info:
  title: MS Géolocalisation des patrimoines - API
  description: "API Contract-First du microservice de géolocalisation des patrimoines\ntouristiques du PGVPT.\n\nCe microservice\
    \ assure :\n  - la gestion des coordonnées géographiques des patrimoines ;\n  - la gestion de la localisation administrative\
    \ ;\n  - la recherche spatiale ;\n  - le calcul des distances ;\n  - la recherche des patrimoines dans un rayon ;\n  -\
    \ la gestion des points d'intérêt ;\n  - la gestion des zones géographiques ;\n  - la gestion des itinéraires et points\
    \ d'accès ;\n  - la production de données cartographiques ;\n  - l'exploitation des informations géospatiales;\n  - Une\
    \ géolocalisation peut être associée soit à un patrimoine (ms-patrimoine), soit à une entreprise (ms-entreprise), mais\
    \ jamais aux deux simultanément.\"\n\n    Version 13.0.0 : contrat consolidé pour une génération Spring Boot 3 / Jakarta\n\
    \    avec validation, pagination homogène, sécurité JWT, gestion d'erreurs standardisée\n    et contraintes métier explicites.\n\
    \nModèle d'héritage : `BaseEntity` constitue la classe racine commune des entités persistantes. La géolocalisation est\
    \ un modèle métier distinct et n'est pas implémentée par `BaseEntity`."
  version: 13.0.1
  contact:
    name: PGVPT
    email: contact@pgvpt.sn
servers:
- url: http://localhost:3002/api/v1
  description: Environnement local
- url: https://api.pgvpt.sn/geolocalisation/api/v1
  description: Environnement de production
tags:
- name: Referentiel administratif
  description: Pays, régions, départements, communes, villages et quartiers
- name: Zone geographique
  description: Zones géographiques composées de régions
- name: Zone touristique
  description: Zone touristique rattachées à une zone géographique
- name: Geolocalisations
  description: Coordonnées et rattachement des patrimoines
- name: Geospatial
  description: Recherche géographique, Calcul des distances et Points d'accès
paths:
  /geolocalisations:
    get:
      tags:
      - Geolocalisations
      summary: Lister les Geolocalisations
      operationId: getGeolocalisations
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - name: departement
        in: query
        schema:
          type: string
      - name: commune
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Liste des Geolocalisations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageGeolocalisation'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
      - Geolocalisations
      summary: Créer une géolocalisation
      operationId: createGeolocalisation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeolocalisationCreate'
      responses:
        '201':
          description: Géolocalisation créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Geolocalisation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      parameters: []
      security:
      - bearerAuth: []
  /geolocalisations/{id}:
    get:
      tags:
      - Geolocalisations
      summary: Obtenir une géolocalisation
      operationId: getGeolocalisation
      responses:
        '200':
          description: Géolocalisation trouvée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Geolocalisation'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
      - Geolocalisations
      summary: Modifier une géolocalisation
      operationId: updateGeolocalisation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeolocalisationUpdate'
      responses:
        '200':
          description: Géolocalisation modifiée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Geolocalisation'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - bearerAuth: []
    patch:
      tags:
      - Geolocalisations
      summary: Mise à jour partielle d'une géolocalisation
      operationId: patchGeolocalisation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeolocalisationUpdate'
      responses:
        '200':
          description: Géolocalisation modifiée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Geolocalisation'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - bearerAuth: []
    delete:
      tags:
      - Geolocalisations
      summary: Supprimer une géolocalisation
      operationId: deleteGeolocalisation
      responses:
        '204':
          description: Géolocalisation supprimée
        '500':
          $ref: '#/components/responses/InternalServerError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - bearerAuth: []
    parameters:
    - $ref: '#/components/parameters/GeolocalisationId'
  /patrimoines/{patrimoineId}/geolocalisation:
    get:
      tags:
      - Geolocalisations
      summary: Obtenir la géolocalisation d'un patrimoine
      operationId: getPatrimoineGeolocalisation
      responses:
        '200':
          description: Géolocalisation du patrimoine
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Geolocalisation'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
      - Geolocalisations
      summary: Mettre à jour la géolocalisation d'un patrimoine
      operationId: updatePatrimoineGeolocalisation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeolocalisationUpdate'
      responses:
        '200':
          description: Géolocalisation mise à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Geolocalisation'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - bearerAuth: []
    patch:
      tags:
      - Geolocalisations
      summary: Mise à jour partielle de la géolocalisation d'un patrimoine
      operationId: patchPatrimoineGeolocalisation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeolocalisationUpdate'
      responses:
        '200':
          description: Géolocalisation mise à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Geolocalisation'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - bearerAuth: []
    parameters:
    - $ref: '#/components/parameters/PatrimoineId'
  /patrimoines/{patrimoineId}/points-acces:
    get:
      tags:
      - Geospatial
      summary: Lister les points d'accès d'un patrimoine
      operationId: getPointsAcces
      responses:
        '200':
          description: Points d'accès
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PointAcces'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
      - Geospatial
      summary: Ajouter un point d'accès
      operationId: createPointAcces
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PointAccesCreate'
      responses:
        '201':
          description: Point d'accès créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PointAcces'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - bearerAuth: []
    parameters:
    - $ref: '#/components/parameters/PatrimoineId'
  /points-acces/{id}:
    put:
      tags:
      - Geospatial
      summary: Modifier un point d'accès
      operationId: updatePointAcces
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PointAccesCreate'
      responses:
        '200':
          description: Point d'accès modifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PointAcces'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - bearerAuth: []
    delete:
      tags:
      - Geospatial
      summary: Supprimer un point d'accès
      operationId: deletePointAcces
      responses:
        '204':
          description: Point d'accès supprimé
        '500':
          $ref: '#/components/responses/InternalServerError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - bearerAuth: []
    parameters:
    - $ref: '#/components/parameters/PointAccesId'
  /geolocalisations/recherche/rayon:
    get:
      tags:
      - Geospatial
      summary: Rechercher les patrimoines dans un rayon
      operationId: rechercherDansRayon
      parameters:
      - name: latitude
        in: query
        required: true
        schema:
          type: number
          format: double
          minimum: -90
          maximum: 90
      - name: longitude
        in: query
        required: true
        schema:
          type: number
          format: double
          minimum: -180
          maximum: 180
      - name: rayonKm
        in: query
        required: true
        schema:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
      - name: typePatrimoine
        in: query
        schema:
          type: string
      - name: categorie
        in: query
        schema:
          type: string
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Patrimoines trouvés dans le rayon
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagePatrimoineGeographique'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /geolocalisations/recherche/bbox:
    get:
      tags:
      - Geospatial
      summary: Rechercher les patrimoines dans une emprise géographique
      operationId: rechercherDansBoundingBox
      parameters:
      - name: minLatitude
        in: query
        required: true
        schema:
          type: number
          format: double
          minimum: -90
          maximum: 90
      - name: minLongitude
        in: query
        required: true
        schema:
          type: number
          format: double
          minimum: -180
          maximum: 180
      - name: maxLatitude
        in: query
        required: true
        schema:
          type: number
          format: double
          minimum: -90
          maximum: 90
      - name: maxLongitude
        in: query
        required: true
        schema:
          type: number
          format: double
          minimum: -180
          maximum: 180
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Patrimoines situés dans l'emprise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagePatrimoineGeographique'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /geolocalisations/distance:
    get:
      tags:
      - Geospatial
      summary: Calculer la distance entre deux positions
      operationId: calculerDistance
      parameters:
      - name: latitudeDepart
        in: query
        required: true
        schema:
          type: number
          format: double
      - name: longitudeDepart
        in: query
        required: true
        schema:
          type: number
          format: double
      - name: latitudeArrivee
        in: query
        required: true
        schema:
          type: number
          format: double
      - name: longitudeArrivee
        in: query
        required: true
        schema:
          type: number
          format: double
      responses:
        '200':
          description: Distance calculée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Distance'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /geolocalisations/distance/patrimoines:
    get:
      tags:
      - Geospatial
      summary: Calculer la distance entre deux patrimoines
      operationId: calculerDistancePatrimoines
      parameters:
      - name: patrimoineIdDepart
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: patrimoineIdArrivee
        in: query
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Distance entre les patrimoines
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Distance'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /cartographie/patrimoines:
    get:
      tags:
      - Geospatial
      summary: Obtenir les patrimoines pour affichage cartographique
      operationId: getPatrimoinesCarte
      parameters:
      - name: region
        in: query
        schema:
          type: string
      - name: typePatrimoine
        in: query
        schema:
          type: string
      - name: categorie
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Données cartographiques
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FeaturePatrimoine'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /cartographie/geojson:
    get:
      tags:
      - Geospatial
      summary: Exporter les patrimoines au format GeoJSON
      operationId: exportGeoJson
      responses:
        '200':
          description: Collection GeoJSON des patrimoines
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/GeoJsonFeatureCollection'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters: []
  /pays:
    get:
      tags:
      - Referentiel administratif
      summary: Lister les pays
      operationId: getAllPays
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Liste des pays
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagePays'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
      - Referentiel administratif
      summary: Créer un pays
      operationId: createPays
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaysCreate'
      responses:
        '201':
          description: Ressource créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pays'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      parameters: []
      security:
      - bearerAuth: []
  /pays/{id}:
    get:
      tags:
      - Referentiel administratif
      summary: Obtenir un pays
      operationId: getPays
      responses:
        '200':
          description: Pays trouvée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pays'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
      - Referentiel administratif
      summary: Modifier un pays
      operationId: updatePays
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaysUpdate'
      responses:
        '200':
          description: Pays modifiée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pays'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - bearerAuth: []
    delete:
      tags:
      - Referentiel administratif
      summary: Supprimer un pays
      operationId: deletePays
      responses:
        '204':
          description: Pays supprimée
        '500':
          $ref: '#/components/responses/InternalServerError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - bearerAuth: []
    parameters:
    - $ref: '#/components/parameters/PaysId'
  /regions:
    get:
      tags:
      - Referentiel administratif
      summary: Lister les régions
      operationId: getRegions
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Liste des régions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageRegion'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
      - Referentiel administratif
      summary: Créer une region
      operationId: createRegion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegionCreate'
      responses:
        '201':
          description: Ressource créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Region'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      parameters: []
      security:
      - bearerAuth: []
  /regions/{id}:
    get:
      tags:
      - Referentiel administratif
      summary: Obtenir une region
      operationId: getRegion
      responses:
        '200':
          description: Region trouvée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Region'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
      - Referentiel administratif
      summary: Modifier une région
      operationId: updateRegion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegionUpdate'
      responses:
        '200':
          description: Region modifiée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Region'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - bearerAuth: []
    delete:
      tags:
      - Referentiel administratif
      summary: Supprimer une région
      operationId: deleteRegion
      responses:
        '204':
          description: Region supprimée
        '500':
          $ref: '#/components/responses/InternalServerError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - bearerAuth: []
    parameters:
    - $ref: '#/components/parameters/RegionId'
  /departements:
    get:
      tags:
      - Referentiel administratif
      summary: Lister les départements
      operationId: getDepartements
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Liste des départements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageDepartement'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
      - Referentiel administratif
      summary: Créer un(e) departement
      operationId: createDepartement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartementCreate'
      responses:
        '201':
          description: Ressource créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Departement'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      parameters: []
      security:
      - bearerAuth: []
  /departements/{id}:
    get:
      tags:
      - Referentiel administratif
      summary: Obtenir un departement
      operationId: getDepartement
      responses:
        '200':
          description: Departement trouvée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Departement'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
      - Referentiel administratif
      summary: Modifier un département
      operationId: updateDepartement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartementUpdate'
      responses:
        '200':
          description: Département modifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Departement'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - bearerAuth: []
    delete:
      tags:
      - Referentiel administratif
      summary: Supprimer un département
      operationId: deleteDepartement
      responses:
        '204':
          description: Département supprimée
        '500':
          $ref: '#/components/responses/InternalServerError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - bearerAuth: []
    parameters:
    - $ref: '#/components/parameters/DepartementId'
  /communes:
    get:
      tags:
      - Referentiel administratif
      summary: Lister les communes
      operationId: getCommunes
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Liste des communes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageCommune'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
      - Referentiel administratif
      summary: Créer une commune
      operationId: createCommune
      requestBody:
        required: true
        content:
          application/json:
            schema:
